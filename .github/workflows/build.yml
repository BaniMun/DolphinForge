name: DolphinForge build
# Builds a Flipper Zero app (.fap) from any public GitHub repo for the chosen
# firmwares and publishes the files as a GitHub Release tagged build-<request_id>.
# Started by the web page (index.html) through the workflow_dispatch API.
#
# Security: the app being built is someone else's code. The build job has only
# read access and no secrets; the single job allowed to write (create the
# release) never runs that code, it only uploads the finished .fap files.

run-name: "build ${{ inputs.request_id }} ${{ inputs.repo }}"

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Source repo: owner/name or https://github.com/owner/name"
        required: true
      ref:
        description: "Branch, tag or commit (empty = default branch)"
        required: false
        default: ""
      app_dir:
        description: "Folder with application.fam (empty = repo root)"
        required: false
        default: ""
      firmwares:
        description: "Comma list: official,momentum,unleashed"
        required: false
        default: "official,momentum,unleashed"
      channel:
        description: "SDK channel: release or dev"
        required: false
        default: "release"
      versions:
        description: "Archived versions, e.g. official=1.3.4,momentum=mntm-010 (missing = latest)"
        required: false
        default: ""
      request_id:
        description: "Unique id set by the web page to find this run"
        required: true

permissions: {}

concurrency:
  group: build-${{ inputs.request_id }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      repo: ${{ steps.parse.outputs.repo }}
      matrix: ${{ steps.parse.outputs.matrix }}
    steps:
      - name: Validate inputs
        id: parse
        env:
          IN_REPO: ${{ inputs.repo }}
          IN_REF: ${{ inputs.ref }}
          IN_DIR: ${{ inputs.app_dir }}
          IN_FW: ${{ inputs.firmwares }}
          IN_CHANNEL: ${{ inputs.channel }}
          IN_VERSIONS: ${{ inputs.versions }}
          IN_ID: ${{ inputs.request_id }}
        run: |
          python3 - <<'EOF'
          import json, os, re, sys

          def fail(msg):
              print(f"::error::{msg}")
              sys.exit(1)

          repo = os.environ["IN_REPO"].strip()
          repo = re.sub(r"^(https?://)?(www\.)?github\.com/", "", repo)
          repo = re.sub(r"(\.git)?/*$", "", repo)
          if not re.fullmatch(r"[A-Za-z0-9-]{1,39}/[A-Za-z0-9._-]{1,100}", repo):
              fail("Repo must be owner/name or a github.com URL")

          ref = os.environ["IN_REF"].strip()
          if ref and not re.fullmatch(r"[A-Za-z0-9._/-]{1,200}", ref):
              fail("Invalid branch/tag")
          app_dir = os.environ["IN_DIR"].strip().strip("/")
          if app_dir and (not re.fullmatch(r"[A-Za-z0-9._/-]{1,200}", app_dir) or ".." in app_dir):
              fail("Invalid app folder")
          if not re.fullmatch(r"[A-Za-z0-9-]{6,64}", os.environ["IN_ID"]):
              fail("Invalid request id")

          channel = os.environ["IN_CHANNEL"].strip() or "release"
          if channel not in ("release", "dev"):
              fail("Channel must be release or dev")

          # Every SDK comes from the firmware's own official distribution:
          # latest via its update-server index, archived versions via its build archive.
          sdks = {
              "official": ("Official", "", r"\d+\.\d+\.\d+(-rc)?",
                           "https://update.flipperzero.one/builds/firmware/{v}/flipper-z-f7-sdk-{v}.zip"),
              "momentum": ("Momentum", "https://up.momentum-fw.dev/firmware/directory.json", r"mntm-\d{3}",
                           "https://up.momentum-fw.dev/builds/firmware/{v}/flipper-z-f7-sdk-{v}.zip"),
              "unleashed": ("Unleashed", "https://up.unleashedflip.com/directory.json", r"unlshd-\d{3}[a-z]?",
                            "https://github.com/DarkFlippers/unleashed-firmware/releases/download/{v}/flipper-z-f7-sdk-{v}.zip"),
          }
          wanted = [f.strip().lower() for f in os.environ["IN_FW"].split(",") if f.strip()]
          bad = [f for f in wanted if f not in sdks]
          if bad or not wanted:
              fail(f"Unknown firmware: {', '.join(bad) or '(none)'}")

          versions = {}
          for item in filter(None, (x.strip() for x in os.environ["IN_VERSIONS"].split(","))):
              fw, _, ver = item.partition("=")
              fw, ver = fw.strip().lower(), ver.strip()
              if fw not in sdks:
                  fail(f"Unknown firmware in versions: {fw}")
              if ver and ver.lower() != "latest":
                  if not re.fullmatch(sdks[fw][2], ver):
                      fail(f"Invalid {sdks[fw][0]} version: {ver}")
                  versions[fw] = ver

          include = []
          for f in dict.fromkeys(wanted):
              label, index_url, _, archive = sdks[f]
              ver = versions.get(f, "")
              include.append({
                  "fw": f, "label": label, "index_url": index_url, "channel": channel,
                  "version": ver or "latest", "sdk_url": archive.format(v=ver) if ver else "",
                  "ref": ref, "app_dir": app_dir,
              })
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"repo={repo}\n")
              out.write("matrix=" + json.dumps({"include": include}) + "\n")
          print(f"repo={repo} ref={ref or '(default)'} dir={app_dir or '(root)'} fw={wanted} versions={versions or 'latest'}")
          EOF

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    name: ${{ matrix.label }}
    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.prepare.outputs.repo }}
          ref: ${{ matrix.ref }}
          path: src
          submodules: recursive
          persist-credentials: false

      - name: Build (archived SDK ${{ matrix.version }})
        if: matrix.sdk_url != ''
        id: archived
        uses: flipperdevices/flipperzero-ufbt-action@v0.1
        with:
          app-dir: src/${{ matrix.app_dir }}
          sdk-url: ${{ matrix.sdk_url }}

      - name: Build (official SDK)
        if: matrix.sdk_url == '' && matrix.index_url == ''
        id: official
        uses: flipperdevices/flipperzero-ufbt-action@v0.1
        with:
          app-dir: src/${{ matrix.app_dir }}
          sdk-channel: ${{ matrix.channel }}

      - name: Build (custom firmware SDK)
        if: matrix.sdk_url == '' && matrix.index_url != ''
        id: custom
        uses: flipperdevices/flipperzero-ufbt-action@v0.1
        with:
          app-dir: src/${{ matrix.app_dir }}
          sdk-channel: ${{ matrix.channel }}
          sdk-index-url: ${{ matrix.index_url }}

      - name: Collect .fap files
        env:
          FAPS: ${{ steps.archived.outputs.fap-artifacts || steps.official.outputs.fap-artifacts || steps.custom.outputs.fap-artifacts }}
          FW: ${{ matrix.fw }}
          VER: ${{ matrix.version }}
        run: |
          mkdir -p out
          for f in $FAPS; do
            base="$(basename "$f" .fap)"
            cp "$f" "out/${base}-${FW}-${VER}.fap"
          done
          ls -la out
          test -n "$(ls out)"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: fap-${{ matrix.fw }}
          path: out/*.fap
          retention-days: 1

  release:
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download built files
        uses: actions/download-artifact@v4
        with:
          pattern: fap-*
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: build-${{ inputs.request_id }}
          SRC: ${{ needs.prepare.outputs.repo }}
          SRC_REF: ${{ inputs.ref }}
          BUILD_RESULT: ${{ needs.build.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          shopt -s nullglob
          files=(dist/*.fap)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No firmware built successfully"
            exit 1
          fi
          {
            echo "Source: https://github.com/${SRC} ${SRC_REF:+(${SRC_REF})}"
            echo "Build result: ${BUILD_RESULT}"
            echo "Run: ${RUN_URL}"
          } > notes.md

          # The release tag points at a small commit holding just the .fap files, so
          # the web page can download them through the contents API (which allows
          # browser requests) instead of sending people to github.com.
          python3 - "${files[@]}" > tree.json <<'PY'
          import base64, json, os, subprocess, sys
          entries = []
          for path in sys.argv[1:]:
              body = json.dumps({"content": base64.b64encode(open(path, "rb").read()).decode(), "encoding": "base64"})
              out = subprocess.run(["gh", "api", f"repos/{os.environ['GH_REPO']}/git/blobs", "--input", "-", "--jq", ".sha"],
                                   input=body, capture_output=True, text=True, check=True)
              entries.append({"path": os.path.basename(path), "mode": "100644", "type": "blob", "sha": out.stdout.strip()})
          print(json.dumps({"tree": entries}))
          PY
          tree=$(gh api "repos/${GH_REPO}/git/trees" --input tree.json --jq .sha)
          jq -n --arg t "$tree" --arg m "Built files for ${TAG}" '{message: $m, tree: $t, parents: []}' > commit.json
          commit=$(gh api "repos/${GH_REPO}/git/commits" --input commit.json --jq .sha)

          gh release create "$TAG" "${files[@]}" \
            --target "$commit" \
            --title "${SRC} ${SRC_REF}" \
            --notes-file notes.md \
            --prerelease

  cleanup:
    # Uploaded apps live on a throwaway branch upload/<request_id>; remove it
    # once the build is over, whatever the result.
    needs: [prepare, build, release]
    if: ${{ always() && startsWith(inputs.ref, 'upload/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      - name: Delete upload branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQ_ID: ${{ inputs.request_id }}
        run: |
          if ! [[ "$REQ_ID" =~ ^[A-Za-z0-9-]{6,64}$ ]]; then echo "::error::Invalid request id"; exit 1; fi
          gh api -X DELETE "repos/${GH_REPO}/git/refs/heads/upload/${REQ_ID}" || echo "Branch already gone"
